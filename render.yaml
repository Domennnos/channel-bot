# Рецепт для хостинга Render: какой сервис создать и как его запускать.
# Секреты (sync: false) Render спросит при создании — в код они не попадают.
services:
  - type: worker              # «фоновый работник» — программа, которая работает круглосуточно
    name: channel-bot
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    disk:                      # постоянный диск: база и ваши идеи не пропадут при перезапуске
      name: bot-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: DATA_DIR
        value: /data
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CHANNEL_ID
        sync: false
